[project]
name = "techdeals-ingestion-spike"
version = "0.1.0"
description = "Evidence-preserving ingestion of heterogeneous scraped listings"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai-slim[openrouter]==2.57.0",
  "openai==3.31.0",
  "beautifulsoup4>=4.13,<5",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
techdeals-ingest = "techdeals_ingestion.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/techdeals_ingestion"]
