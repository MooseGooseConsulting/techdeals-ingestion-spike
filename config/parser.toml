# Both candidates use this one free model. Credentials arrive through Doppler.
base_url = "https://openrouter.ai/api/v1"
model = "nvidia/nemotron-3.5-lightning:free"
reasoning_enabled = true
batch_size = 8
max_prepared_bytes = 98304
max_package_bytes = 524288
tool_page_bytes = 16384
max_requests = 12
max_tool_calls = 64
max_output_tokens = 16384
context_window_tokens = 1000000
timeout_seconds = 90
package_timeout_seconds = 600
correction_retries = 1
