# Credentials are supplied by the process environment.
base_url = "https://openrouter.ai/api/v1"
model = "nvidia/nemotron-3.5-lightning:free"
reasoning_enabled = true
# Bounds the model's thinking so a long reasoning trace cannot consume the
# whole output budget before the extraction call is emitted. Proven need:
# lightning:free spent all 8192 output tokens reasoning on small-a and never
# called the tool (see .runs/ingest-small-a-002).
reasoning_max_tokens = 4000
max_input_bytes = 524288
# One model call must stay well under the free route's usable context.
# Evidence: a 143KB single input completes; a 229KB 10-input batch fails at
# the provider. Batches never split a linked_group; an oversize single input
# still goes out alone and fails honestly instead of silently.
max_batch_bytes = 150000
max_output_tokens = 8192
timeout_seconds = 90
correction_retries = 1
